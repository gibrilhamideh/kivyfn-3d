[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "kivyfn-3d"
version = "0.1.0"
description = "3D library built on top of kivyfn."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Gibril Hamideh", email = "gibrilhamideh@gmail.com" },
]

dependencies = [
    "kivy>=2.3.0",
    "kivyfn",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "pygltflib>=1.16.0",
    "xxhash>=3.4.1",
]


[project.optional-dependencies]
modifiers = [
    "trimesh",
    "manifold3d",
    "networkx",
    "scipy",
]


[dependency-groups]
dev = [
    "kivy-stubs",
    "watchdog",
]


[tool.uv.sources]
kivyfn = { path = "../kivyfn", editable = true }
kivy-stubs = { path = "../kivy-stubs", editable = true }


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
